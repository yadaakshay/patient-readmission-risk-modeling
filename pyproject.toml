[project]
name = "patient-readmission-risk-modeling"
version = "2.0.0"
description = "Clinical decision support pipeline predicting 30-day all-cause hospital readmission risk for diabetic patients using EHR data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.0",
    "imbalanced-learn>=0.12.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "joblib>=1.4.0",
    "pyarrow>=17.0.0",
    "shap>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
